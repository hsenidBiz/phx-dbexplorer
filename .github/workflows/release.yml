name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  DOTNET_VERSION: "10.0.x"
  PROJECT_PATH: src/PhxDbExplorer/PhxDbExplorer.csproj
  ASSEMBLY_NAME: PhxDbExplorer

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Run unit tests
        run: dotnet test src/PhxDbExplorer.Tests --configuration Release

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, linux-x64, osx-x64, osx-arm64]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Publish ${{ matrix.rid }}
        run: |
          dotnet publish ${{ env.PROJECT_PATH }} \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:Version=${{ steps.version.outputs.version }} \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -o out/${{ matrix.rid }}

      - name: Package archive
        id: package
        working-directory: out/${{ matrix.rid }}
        run: |
          name="${{ env.ASSEMBLY_NAME }}-${{ steps.version.outputs.version }}-${{ matrix.rid }}"
          if [[ "${{ matrix.rid }}" == win-* ]]; then
            archive="${name}.zip"
            zip -r "../../${archive}" ./${{ env.ASSEMBLY_NAME }}.exe
          else
            archive="${name}.tar.gz"
            chmod +x ./${{ env.ASSEMBLY_NAME }}
            tar -czf "../../${archive}" ./${{ env.ASSEMBLY_NAME }}
          fi
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: ${{ steps.package.outputs.archive }}

  publish-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
